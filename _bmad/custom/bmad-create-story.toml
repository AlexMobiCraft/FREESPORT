# Team override: обязательный GitNexus-анализ + путь хранения story-файлов
# в bmad-create-story. Правила GitNexus — в .windsurf/rules/gitnexus.md.
# Коммитить в репозиторий — это командная политика.

[workflow]

activation_steps_append = [
  "GITNEXUS PRE-FLIGHT (обязательно перед шагами 2–4): выполни `npx gitnexus status` через Bash и покажи результат. Если индекс `stale` или отсутствует — попроси пользователя выполнить `! npx gitnexus analyze --force` и дождись ответа: на устаревшем индексе анализ кода не начинай. Если индекс свежий — продолжай.",
]

persistent_facts = [
  "file:{project-root}/.windsurf/rules/gitnexus.md",
  'GITNEXUS В СТОРИ (обязательно): в шагах 2–4 исследуй код только через GitNexus CLI, без Explore-субагента. В Dev Notes стори добавь раздел «GitNexus: зона изменений» — таблицу по каждому символу, который стори меняет: risk, прямые вызывающие и затронутые процессы из `impact <symbol> --summary-only`, тесты из `impact --include-tests`. Порядок — раздел «BMAD-воркфлоу» в .windsurf/rules/gitnexus.md.',
  'ПУТЬ ХРАНЕНИЯ STORY-ФАЙЛОВ (проект FREESPORT): story-файлы лежат в подкаталоге {implementation_artifacts}/Story/, а не в корне {implementation_artifacts}. Корень занят другими артефактами реализации: sprint-status.yaml, spec-*.md, deferred-work.md, tasks/, tech-spec/, retro/. Значение implementation_artifacts в _bmad/bmm/config.yaml менять НЕЛЬЗЯ — оно задаёт корень всех артефактов реализации, а не только стори.',
  'ПЕРЕОПРЕДЕЛЕНИЕ ПЕРЕМЕННЫХ ПУТЕЙ: default_output_file = {implementation_artifacts}/Story/{{story_key}}.md. Поиск предыдущей стори эпика вести в {implementation_artifacts}/Story/ по шаблону {{epic_num}}-{{previous_story_num}}-*.md. Путь sprint_status при этом НЕ меняется — sprint-status.yaml остаётся в корне {implementation_artifacts}.',
]
