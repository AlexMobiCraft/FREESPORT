# Team override: обязательный GitNexus-анализ в bmad-quick-dev
# Коммитить в репозиторий — командная политика.

[workflow]

activation_steps_append = [
  "GITNEXUS PRE-FLIGHT (обязательно): Выполни `npx gitnexus status` через Bash и покажи результат. Если индекс устарел ('stale') или отсутствует — сообщи пользователю: 'Запусти `! npx gitnexus analyze` в терминале, затем перезапусти сессию'. Если индекс свежий — продолжай.",
]

persistent_facts = [
  'ПРАВИЛО АНАЛИЗА КОДА (обязательно): ЗАПРЕЩЕНО запускать Explore-субагента (subagent_type=Explore) для исследования кодовой базы. Вместо этого использовать GitNexus CLI через Bash (MCP-сервер в проекте не подключён, инструментов gitnexus_* нет): npx gitnexus query "<концепция>" — поиск потоков выполнения; npx gitnexus context <symbol> — анализ символа (флаг --file снимает неоднозначность имён). Обе команды печатают JSON. Читать файлы (Read) только для путей, возвращённых GitNexus. Это обязательное требование проекта FREESPORT.',
  'ПРАВИЛО ПЕРЕД РЕДАКТИРОВАНИЕМ (обязательно): Перед изменением любой функции, класса или метода — выполнить npx gitnexus impact <symbol> --direction upstream через Bash и сообщить blast radius пользователю. При "risk": "HIGH" или "CRITICAL" — предупредить до внесения изменений. Команды rename в CLI нет: переименование — вручную по списку из impact/context, текстовая замена запрещена.',
  'ПРИЗНАК УСТАРЕВШЕГО ИНДЕКСА: ответ {"error": "Symbol ... not found"} на заведомо существующий символ означает, что индекс не содержит свежий код, а не что кода нет. В этом случае сообщить пользователю про ! npx gitnexus analyze.',
]
