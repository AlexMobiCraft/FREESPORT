# Team override: обязательный GitNexus-анализ при ревью кода
# Коммитить в репозиторий — командная политика.

[workflow]

activation_steps_prepend = [
  'ВЫБОР ИСПОЛНИТЕЛЯ РЕВЬЮ: при каждом запуске, до запуска любых ревьюеров, спроси: «Использовать текущую модель для запуска субагентов или использовать плагин Codex?» Варианты: «Текущая модель» и «Плагин Codex». Дождись явного ответа; при пропуске вопроса или отсутствии ответа никого не запускай. Сохрани выбор только на текущий прогон.',
]

activation_steps_append = [
  "GITNEXUS PRE-FLIGHT (обязательно): Выполни `npx gitnexus status` через Bash и покажи результат. Если индекс устарел ('stale') — сообщи пользователю запустить `! npx gitnexus analyze --skip-agents-md`. Если свежий — продолжай.",
]

persistent_facts = [
  'ПРАВИЛО АНАЛИЗА ПРИ РЕВЬЮ (обязательно): Для понимания контекста изменений выполнить npx gitnexus detect-changes --scope all через Bash — покажет затронутые символы и потоки (вывод текстовый). Для оценки blast radius изменённых функций — npx gitnexus impact <symbol> --direction upstream (вывод JSON). MCP-сервер в проекте не подключён, инструментов gitnexus_* нет. ЗАПРЕЩЕНО использовать Explore-субагента вместо этих команд.',
  'ПРИЗНАК УСТАРЕВШЕГО ИНДЕКСА: ответ {"error": "Symbol ... not found"} на заведомо существующий символ означает, что индекс не содержит свежий код, а не что кода нет. В этом случае сообщить пользователю про ! npx gitnexus analyze --skip-agents-md.',
  'ИСПОЛНЕНИЕ РЕВЬЮ: все активные слои запускай только выбранным способом. «Текущая модель» означает нативных субагентов, наследующих модель текущей сессии, без обращения к плагину Codex. В Devin используй subagent_general, а не subagent_explore; ревьюерам запрети изменения файлов. «Плагин Codex» означает запуск ревьюеров через доступный плагин Codex с сохранением инструкций и изоляции каждого слоя; для этого выбора допускается модель плагина вместо модели текущей сессии.',
  'НЕТ НЕЯВНОГО ПЕРЕКЛЮЧЕНИЯ: если выбранный способ недоступен или не позволяет обеспечить нужную модель, останови запуск и предложи пользователю выбрать другой способ. Не устанавливай плагин и не переключай исполнителя автоматически. При повторных запусках слоёв в рамках того же прогона сохраняй сделанный выбор.',
]
