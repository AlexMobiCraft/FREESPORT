# Team override: путь хранения story-файлов в проекте FREESPORT.
# Коммитить в репозиторий — командная политика.

[workflow]

persistent_facts = [
  'ПУТЬ ХРАНЕНИЯ STORY-ФАЙЛОВ (проект FREESPORT): story-файлы лежат в подкаталоге {implementation_artifacts}/Story/, а не в корне {implementation_artifacts}. Корень занят другими артефактами реализации: sprint-status.yaml, spec-*.md, deferred-work.md, tasks/, tech-spec/, retro/. Значение implementation_artifacts в _bmad/bmm/config.yaml менять НЕЛЬЗЯ — оно задаёт корень всех артефактов реализации, а не только стори.',
  'ПЕРЕОПРЕДЕЛЕНИЕ ПЕРЕМЕННЫХ ПУТЕЙ: story_location = {implementation_artifacts}/Story и story_location_absolute = {implementation_artifacts}/Story. Детект статуса стори (шаг 3) выполнять по пути {implementation_artifacts}/Story/{story-key}.md. В генерируемый sprint-status.yaml писать story_location: "{project-root}/_bmad-output/implementation-artifacts/Story". Путь status_file при этом НЕ меняется — sprint-status.yaml остаётся в корне {implementation_artifacts}.',
]
