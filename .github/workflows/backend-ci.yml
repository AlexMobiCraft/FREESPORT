name: Backend CI/CD

# Единственный триггер — PR в develop: там стоит гейт качества (5 required-чеков).
# push-триггера нет намеренно (2026-09-20): синк develop -> main идёт fast-forward
# пушем того же коммита, который уже зелёный на PR, и push-прогоны перепроверяли
# ровно тот же код во второй и третий раз. Подробности — .windsurf/rules/git-sync-workflow.md.
on:
  pull_request:
    branches: [develop]
    # paths-фильтра у pull_request нет намеренно: этот чек входит в required-контексты
    # защиты develop, а required-контекст у workflow с фильтром путей не сообщает статус
    # на PR, который эти пути не трогает, — GitHub показывает «Expected — waiting for
    # status» и мерж блокируется бессрочно.

# Новый push в ту же PR-ветку отменяет прогон на устаревшем коммите: его результат
# всё равно никого не интересует, а раннер он занимает (добавлено 2026-09-20).
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
jobs:
  # Линтеры, типы, security и валидация OpenAPI. pytest здесь НЕ запускается (снято
  # 2026-09-20): прежний «fast unit gate» гонял ~1900 тестов с фильтром
  # "not integration and not data_dependent and not performance and not slow", то есть
  # строгое подмножество полного прогона из main.yml (~3000 тестов, там же считается
  # покрытие). Одни и те же тесты исполнялись на каждом PR дважды. Время ожидания PR от
  # этого не росло — оба прогона шли параллельно и итог определял 13-минутный main.yml, —
  # но ~3,5 минуты раннера на каждый PR уходило впустую.
  # Вернуть быстрый сигнал о падении теста = вернуть сюда шаг pytest с тем же фильтром.
  # Этап 1: Качество кода и тестирование
  test:
    # Имя задано явно: без него check-run называется по id джобы («test»), а такое же
    # имя у джобы во frontend-ci.yml — как required-контексты они неразличимы.
    name: "Бэкенд: качество кода"
    runs-on: ubuntu-latest

    # Без лимита зависший прогон висит дефолтные 6 часов. Факт: медиана 2,3 мин, максимум 4,0 (14
    # прогонов).
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: read
    env:
      DB_NAME: freesport_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      REDIS_URL: redis://localhost:6379/0

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: freesport_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Тяжёлые шаги ниже пропускаются, если PR состоит только из документации.
      # Логика и списки путей — в .github/actions/docs-only-check (там же объяснено,
      # почему не по имени ветки и почему скипаются шаги, а не job).
      - name: Нужен ли прогон
        id: changes
        uses: ./.github/actions/docs-only-check
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Create virtual environment and install dependencies
        if: steps.changes.outputs.run == 'true'
        run: |
          cd backend
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-django pytest-cov black flake8 mypy bandit safety

      - name: Create .env file for testing
        if: steps.changes.outputs.run == 'true'
        run: |
          cd backend
          cat > .env << EOF
          SECRET_KEY=test-secret-key-for-ci-cd-only
          DB_NAME=freesport_test
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_HOST=localhost
          DB_PORT=5432
          REDIS_URL=redis://localhost:6379/0
          DJANGO_SETTINGS_MODULE=freesport.settings.test
          EOF

      - name: Run linting with Black
        if: steps.changes.outputs.run == 'true'
        run: |
          cd backend
          source venv/bin/activate
          black .

      - name: Run linting with Flake8
        if: steps.changes.outputs.run == 'true'
        run: |
          cd backend
          source venv/bin/activate
          flake8 . --max-line-length=120 --extend-ignore=E203,W503

      - name: Run type checking with mypy
        if: steps.changes.outputs.run == 'true'
        run: |
          cd backend
          source venv/bin/activate
          mypy --config-file=mypy.ini .
        continue-on-error: true # Не блокируем сборку из-за mypy warnings

      - name: Run security checks with bandit
        if: steps.changes.outputs.run == 'true'
        run: |
          cd backend
          source venv/bin/activate
          # Сканируем только исходный код приложений, используя конфиг .bandit
          bandit -r apps/ freesport/ -f json -o bandit-report.json || true
          bandit -r apps/ freesport/ -ll || true
        continue-on-error: true # Не блокируем сборку из-за Medium severity проблем

      - name: Check dependencies for security vulnerabilities
        if: steps.changes.outputs.run == 'true'
        run: |
          cd backend
          source venv/bin/activate
          echo "🔍 Проверка зависимостей на уязвимости..."
          safety check --json --output safety-report.json || true
          echo "📋 Подробный отчет о найденных уязвимостях:"
          safety check --full-report || true
        continue-on-error: true # Не блокируем сборку из-за уязвимостей в зависимостях

      - name: Run Django system checks
        if: steps.changes.outputs.run == 'true'
        run: |
          cd backend
          source venv/bin/activate
          python manage.py check --deploy

      - name: Validate API documentation completeness
        if: steps.changes.outputs.run == 'true'
        run: |
          cd backend
          source venv/bin/activate
          echo "🔍 Проверка полноты API документации..."
          python manage.py check_api_docs --verbose || true
        continue-on-error: true # Не блокируем сборку из-за неполной документации API

      # Полную сверку контракта делает api-contract.yml — там та же генерация с --validate,
      # но результат ещё и сравнивается с закоммиченным docs/api/openapi.yaml. Этот шаг
      # оставлен намеренно, хотя и дублирует генерацию: он живёт внутри джобы `test`,
      # которая указана в required-контекстах setup-branch-protection.sh, тогда как новый
      # workflow там пока не указан. Удалять его до того, как гейт станет обязательным,
      # значит менять блокирующую проверку на необязательную. Стоит ~10 секунд.
      - name: Validate OpenAPI schema generation
        if: steps.changes.outputs.run == 'true'
        run: |
          cd backend
          source venv/bin/activate
          echo "📋 Генерация и валидация OpenAPI схемы..."
          python manage.py spectacular --color --file /tmp/schema.yml --validate
          echo "✅ OpenAPI схема сгенерирована успешно"

      - name: Run database migrations
        if: steps.changes.outputs.run == 'true'
        env:
          DJANGO_SETTINGS_MODULE: freesport.settings.test
        run: |
          cd backend
          source venv/bin/activate
          # Отладка: выводим переменные окружения БД
          echo "🔍 Database environment variables:"
          echo "DB_USER=$DB_USER"
          echo "DB_NAME=$DB_NAME"
          echo "DB_HOST=$DB_HOST"
          echo "DB_PORT=$DB_PORT"
          echo "DJANGO_SETTINGS_MODULE=$DJANGO_SETTINGS_MODULE"
          # Проверяем настройки Django
          python -c "import os; os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'freesport.settings.test'); import django; django.setup(); from django.conf import settings; print('🔍 Django DB settings:'); print(f\"USER: {settings.DATABASES['default']['USER']}\"); print(f\"NAME: {settings.DATABASES['default']['NAME']}\"); print(f\"HOST: {settings.DATABASES['default']['HOST']}\")"
          # Пересоздаем тестовую БД для чистого старта
          echo "🔄 Пересоздание тестовой базы данных..."
          PGPASSWORD=postgres psql -h localhost -U postgres -c "DROP DATABASE IF EXISTS freesport_test;" || true
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE freesport_test;" || true
          # Сбрасываем соединения с БД перед миграциями для избежания проблем с транзакциями
          python -c "import django; django.setup(); from django.db import connections; connections.close_all()" || true
          python manage.py migrate --noinput

      # Codecov-выгрузка переехала в main.yml вместе с подсчётом покрытия (2026-08-06):
      # отчёт должен строить прогон, который исполняет покрывающие тесты.

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: backend-test-results
          retention-days: 1
          path: |
            backend/bandit-report.json
            backend/safety-report.json

# Сборки Docker-образов и деплоя здесь нет намеренно (2026-09-20). Прод тянет тег
# `:production`, а его собирает только deploy.yml — образы `latest`/`commit-<sha>`,
# которые собирал прежний job `build`, не использовал никто, и на каждый push в main
# уходило ~10 минут раннера на multiarch-сборку в никуда. Вся прод-цепочка (сборка →
# approval → SSH-деплой → откат) живёт в deploy.yml и запускается push-ем в main.
# Прежний job `deploy-staging` был мёртв (needs: build, а build шёл только на main) и
# при «починке» задеплоил бы develop на прод: deploy.yml без входа `environment`
# подставляет `production`.
