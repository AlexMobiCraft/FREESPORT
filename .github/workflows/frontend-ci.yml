name: Фронтенд CI/CD

# Единственный триггер — PR в develop: там стоит гейт качества (5 required-чеков).
# push-триггера нет намеренно (2026-09-20): синк develop -> main идёт fast-forward
# пушем того же коммита, который уже зелёный на PR, и push-прогоны перепроверяли
# ровно тот же код во второй и третий раз. Подробности — .windsurf/rules/git-sync-workflow.md.
on:
  pull_request:
    branches: [develop]
    # paths-фильтра у pull_request нет намеренно — см. тот же комментарий в backend-ci.yml:
    # required-контекст с фильтром путей вешает мерж на «Expected — waiting for status».

# Новый push в ту же PR-ветку отменяет прогон на устаревшем коммите: его результат
# всё равно никого не интересует, а раннер он занимает (добавлено 2026-09-20).
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.x"
  NEXT_PUBLIC_API_URL: "http://localhost:8001/api/v1"

jobs:
  # Этап 1: Качество кода и тестирование
  test:
    # Имя задано явно: без него check-run называется по id джобы («test»), а такое же
    # имя у джобы в backend-ci.yml — как required-контексты они неразличимы.
    name: "Фронтенд: тесты"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7

      # Тяжёлые шаги ниже пропускаются, если PR состоит только из документации.
      # Логика и списки путей — в .github/actions/docs-only-check (там же объяснено,
      # почему не по имени ветки и почему скипаются шаги, а не job).
      - name: Нужен ли прогон
        id: changes
        uses: ./.github/actions/docs-only-check
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Настройка Node.js ${{ env.NODE_VERSION }}
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        if: steps.changes.outputs.run == 'true'
        run: |
          cd frontend
          npm ci --prefer-offline --no-audit

      - name: Установка lightningcss бинарников для Ubuntu
        if: steps.changes.outputs.run == 'true'
        run: |
          cd frontend
          npm install lightningcss-linux-x64-gnu@1.30.1 --no-save --force
          npm install @tailwindcss/oxide-linux-x64-gnu@4.1.11 --no-save --force

      - name: Создание .env.local для тестирования
        if: steps.changes.outputs.run == 'true'
        run: |
          cd frontend
          cat > .env.local << EOF
          NEXT_PUBLIC_API_URL=http://localhost:8001/api/v1
          NODE_ENV=test
          EOF

      - name: Проверка кода с ESLint
        if: steps.changes.outputs.run == 'true'
        run: |
          cd frontend
          npm run lint

      - name: Проверка форматирования с Prettier
        if: steps.changes.outputs.run == 'true'
        run: |
          cd frontend
          npm run format:check

      - name: Проверка типов TypeScript
        if: steps.changes.outputs.run == 'true'
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Проверка безопасности зависимостей
        if: steps.changes.outputs.run == 'true'
        run: |
          cd frontend
          npm audit --audit-level high
        continue-on-error: true # Не блокируем сборку из-за предупреждений audit

      - name: Запуск тестов с покрытием
        if: steps.changes.outputs.run == 'true'
        run: |
          cd frontend
          npm run test:coverage
        env:
          CI: true

      - name: Сборка Next.js приложения
        if: steps.changes.outputs.run == 'true'
        run: |
          cd frontend
          npm run build

      # Стори 41.21: fail-closed проверка собранного приложения — в чанках
      # публичных страниц нет `example` и zustand devtools, настоящий 404 несёт
      # один robots=noindex, soft-404 — 200 и noindex, follow. Скрипт поднимает
      # next start и заглушку backend по NEXT_PUBLIC_API_URL из env workflow —
      # того же, с которым шла сборка (адрес вшит в middleware).
      - name: Проверка production-сборки (чанки и robots)
        if: steps.changes.outputs.run == 'true'
        run: |
          cd frontend
          npm run check:build

      - name: Анализ размера сборки
        if: steps.changes.outputs.run == 'true'
        run: |
          cd frontend
          npx @next/bundle-analyzer --help || echo "Анализатор сборки не настроен"

      - name: Загрузка результатов тестов и покрытия
        uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: frontend-test-results
          retention-days: 1
          path: |
            frontend/coverage/

      - name: Загрузка отчетов покрытия в Codecov
        if: steps.changes.outputs.run == 'true'
        uses: codecov/codecov-action@v7
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

# Сборки Docker-образов и деплоя здесь нет намеренно (2026-09-20) — см. тот же
# комментарий в backend-ci.yml. Прод использует только тег `:production` из deploy.yml.
# Дополнительно: прежний `build` стоял под `if: github.event_name == 'push'` без фильтра
# ветки и собирал multiarch-образы ещё и на каждый push в develop.
