# E2E Tests Workflow
# Story 15.5: E2E тестирование checkout флоу
#
# Запускает E2E тесты Playwright на PR в develop

name: E2E Tests

# Единственный триггер — PR в develop: там стоит гейт качества (5 required-чеков).
# push-триггера нет намеренно (2026-09-20): синк develop -> main идёт fast-forward
# пушем того же коммита, который уже зелёный на PR, и push-прогоны перепроверяли
# ровно тот же код во второй и третий раз. Подробности — .windsurf/rules/git-sync-workflow.md.
on:
  pull_request:
    branches: [develop]
    paths:
      - "frontend/**"
      - ".github/workflows/e2e-tests.yml"

# Новый push в ту же PR-ветку отменяет прогон на устаревшем коммите: его результат
# всё равно никого не интересует, а раннер он занимает (добавлено 2026-09-20).
concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8001/api/v1

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 1

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        continue-on-error: true
        with:
          name: test-results
          path: frontend/test-results/
          retention-days: 1
