name: Django CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    # Глобальные переменные окружения для всего job
    env:
      SECRET_KEY: a_test_secret_key_for_ci
      DEBUG: "False"
      DB_NAME: test_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: freesport.settings.test
      # Доступны ли реальные выгрузки 1С этому прогону.
      # GitHub не передаёт Actions secrets в workflow, запущенный из fork: `ONEC_DATA_TOKEN`
      # приходит пустым, checkout приватного FREESPORT-1c-test-data падает, и job краснеет
      # до первого теста — внешний контрибьютор не может получить зелёный CI в принципе.
      # Та же беда у Dependabot, хотя его ветка `dependabot/...` лежит в самом репозитории и
      # сравнение репозиториев ниже даёт true: у Dependabot отдельное хранилище секретов
      # (Settings → Secrets and variables → Dependabot), обычные Actions secrets ему не видны.
      # Поэтому он исключается явно, а не через принадлежность head-ветки.
      # true  — push или PR из этого же репозитория (кроме Dependabot): гоняем весь набор.
      # false — PR из fork или от Dependabot: data_dependent исключаются, порог — без данных.
      ONEC_DATA_AVAILABLE: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout 1C test data
        if: env.ONEC_DATA_AVAILABLE == 'true'
        uses: actions/checkout@v4
        with:
          repository: AlexMobiCraft/FREESPORT-1c-test-data
          path: backend/data/import_1c
          token: ${{ secrets.ONEC_DATA_TOKEN }}
        # Приватный репо с реальными XML-выгрузками 1С для data_dependent-тестов.
        # Без этого шага ~32 теста импорта 1С скипаются (pytest.skip), а покрываемый
        # ими код идёт в непокрытое — порог покрытия занижен на ~1,5 п.п.
        # На доверенном прогоне ненастроенный секрет валит шаг — это намеренно: лучше
        # красный CI, чем молчаливая деградация покрытия. См. scripts/prep-1c-test-data.sh.
        # На PR из fork и на прогоне Dependabot шаг пропускается целиком (секретов там нет
        # по устройству GitHub), и прогон уходит на ветку без данных — см. шаг «Run tests
        # with coverage».

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest-django pytest-cov flake8

      - name: Wait for PostgreSQL and Redis
        run: |
          sudo apt-get update && sudo apt-get install -y netcat-traditional
          # В GitHub Actions сервисы доступны через localhost
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            nc -z localhost 5432 && echo "Postgres is up." && break
            echo "Waiting for Postgres... ($i/30)"
            sleep 2
          done

          echo "Waiting for Redis..."
          for i in {1..30}; do
            nc -z localhost 6379 && echo "Redis is up." && break
            echo "Waiting for Redis... ($i/30)"
            sleep 2
          done

          # Финальная проверка
          nc -z localhost 5432 || (echo "PostgreSQL failed to start" && exit 1)
          nc -z localhost 6379 || (echo "Redis failed to start" && exit 1)
          echo "All services are ready!"

      - name: Lint with flake8
        run: |
          pip install flake8
          # --exit-zero не прерывает выполнение при ошибках, только сообщает о них
          flake8 backend/ --max-line-length=120 --extend-ignore=E203,W503 --exit-zero

      - name: Create .env file for testing
        run: |
          cd backend
          cat > .env << EOF
          SECRET_KEY=test-secret-key-for-ci-cd-only
          DB_NAME=test_db
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_HOST=localhost
          DB_PORT=5432
          REDIS_URL=redis://localhost:6379/0
          DJANGO_SETTINGS_MODULE=freesport.settings.test
          EOF

      - name: Run Django system checks
        run: |
          cd backend
          python manage.py check

      - name: Apply migrations
        run: |
          cd backend
          # Сбрасываем соединения с БД перед миграциями для избежания проблем с транзакциями
          python -c "import django; django.setup(); from django.db import connections; connections.close_all()" || true
          python manage.py migrate --noinput

      - name: Run tests with coverage
        run: |
          cd backend
          # Весь набор, кроме перф- и медленных: и те и другие меряют время, поэтому падают
          # от загрузки раннера, а не от дефекта в PR. Исполняются в performance-tests.yml.
          #
          # Покрытие считается здесь, а не в backend-ci.yml, потому что покрытие обязан мерить
          # тот прогон, который реально исполняет покрывающие тесты. Быстрый гейт запускает
          # ~1900 тестов из ~3000 и не видит интеграционных: на нём то же продакшен-покрытие
          # даёт 62 %, здесь — 76 % (замер 2026-08-06). Пока мерил быстрый гейт, каждая стори
          # с интеграционными тестами опускала метрику, и порог ломался сам собой.
          # Состав знаменателя (без тестов и миграций) задан в backend/pyproject.toml.
          #
          # Порог 75: до 2026-08-15 порог был 73 — каталог backend/data/import_1c/ в .gitignore
          # и ~32 теста импорта 1С скипались на раннере, покрываемый ими код шёл в непокрытое.
          # Теперь данные подключаются из приватного репо FREESPORT-1c-test-data (шаг checkout
          # выше), тесты исполняются, и разрыв в 1,5 п.п. между локальным и CI замером закрыт.
          # Замеры 2026-08-07: локально 76,43 %, в CI 74,92 % без данных; с данными — ожидаемо
          # ~76 %. Порог 75 оставляет запас в 1 п.п. на флуктуацию.
          #
          # Ветка без данных — PR из fork и прогон Dependabot: секретов там нет, приватный
          # data-репо не подключён. data_dependent-тесты и так скипнулись бы сами, но исключаем
          # их явно, чтобы прогон честно сообщал состав; порог — историческое значение без
          # данных (73), при 75 такой PR краснел бы на замере 74,92 % без всякой регрессии.
          if [ "$ONEC_DATA_AVAILABLE" = "true" ]; then
            pytest --tb=short -v -m "not performance and not slow" --cov=apps --cov=freesport --cov-report=xml --cov-report=term-missing --cov-fail-under=75
          else
            echo "::notice::Прогон без Actions secrets (PR из fork или Dependabot): приватный data-репо недоступен, data_dependent-тесты исключены, порог покрытия 73"
            pytest --tb=short -v -m "not performance and not slow and not data_dependent" --cov=apps --cov=freesport --cov-report=xml --cov-report=term-missing --cov-fail-under=73
          fi

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
