name: Django CI

# Единственный триггер — PR в develop: там стоит гейт качества (7 required-чеков).
# push-триггера нет намеренно (2026-09-20): синк develop -> main идёт fast-forward
# пушем того же коммита, который уже зелёный на PR, и push-прогоны перепроверяли
# ровно тот же код во второй и третий раз. Подробности — .windsurf/rules/git-sync-workflow.md.
on:
  pull_request:
    branches: ["develop"]

# Новый push в ту же PR-ветку отменяет прогон на устаревшем коммите: его результат
# всё равно никого не интересует, а раннер он занимает (добавлено 2026-09-20).
concurrency:
  group: django-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # Без лимита зависший прогон висит дефолтные 6 часов: занимает слот раннера и
    # держит PR на автомёрдже, потому что required-контекст не закрывается.
    #
    # 30 минут — при обычных ~13. Запас двукратный, но не бесконечный: прогон
    # 35508450593 (20.09.2026) отработал успешно за 31 минуту на медленном раннере,
    # и этот лимит его бы убил. Если такое повторится — перезапустить прогон, а при
    # регулярных падениях по таймауту поднимать лимит, а не убирать его.
    timeout-minutes: 30

    permissions:
      contents: read
      pull-requests: read

    # Глобальные переменные окружения для всего job
    env:
      SECRET_KEY: a_test_secret_key_for_ci
      DEBUG: "False"
      DB_NAME: test_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: freesport.settings.test
      # Доступны ли реальные выгрузки 1С этому прогону.
      # GitHub не передаёт Actions secrets в workflow, запущенный из fork: `ONEC_DATA_TOKEN`
      # приходит пустым, checkout приватного FREESPORT-1c-test-data падает, и job краснеет
      # до первого теста — внешний контрибьютор не может получить зелёный CI в принципе.
      # Та же беда у Dependabot, хотя его ветка `dependabot/...` лежит в самом репозитории и
      # сравнение репозиториев ниже даёт true: у Dependabot отдельное хранилище секретов
      # (Settings → Secrets and variables → Dependabot), обычные Actions secrets ему не видны.
      # Поэтому он исключается явно, а не через принадлежность head-ветки.
      # true  — push или PR из этого же репозитория (кроме Dependabot): гоняем весь набор.
      # false — PR из fork или от Dependabot: data_dependent исключаются, порог — без данных.
      ONEC_DATA_AVAILABLE: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    # Здесь нет шагов линтинга и `manage.py migrate` (сняты 2026-09-20):
    # flake8 запускался с `--exit-zero`, то есть не мог уронить прогон, а блокирующая
    # проверка тем же flake8 живёт в backend-ci.yml. `migrate` применял миграции к базе
    # `test_db`, тогда как pytest-django создаёт и мигрирует собственную `test_test_db`
    # (`TEST.NAME` в settings/test.py не задан) — к результату прогона он отношения не имел.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Тяжёлые шаги ниже пропускаются, если PR состоит только из документации.
      # Логика и списки путей — в .github/actions/docs-only-check (там же объяснено,
      # почему не по имени ветки и почему скипаются шаги, а не job).
      - name: Нужен ли прогон
        id: changes
        uses: ./.github/actions/docs-only-check
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout 1C test data
        if: steps.changes.outputs.run == 'true' && env.ONEC_DATA_AVAILABLE == 'true'
        uses: actions/checkout@v7
        with:
          repository: AlexMobiCraft/FREESPORT-1c-test-data
          path: backend/data/import_1c
          token: ${{ secrets.ONEC_DATA_TOKEN }}
        # Приватный репо с реальными XML-выгрузками 1С для data_dependent-тестов.
        # Без этого шага ~32 теста импорта 1С скипаются (pytest.skip), а покрываемый
        # ими код идёт в непокрытое — порог покрытия занижен на ~1,5 п.п.
        # На доверенном прогоне ненастроенный секрет валит шаг — это намеренно: лучше
        # красный CI, чем молчаливая деградация покрытия. См. scripts/prep-1c-test-data.sh.
        # На PR из fork и на прогоне Dependabot шаг пропускается целиком (секретов там нет
        # по устройству GitHub), и прогон уходит на ветку без данных — см. шаг «Run tests
        # with coverage».

      - name: Set up Python ${{ matrix.python-version }}
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        if: steps.changes.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest-django pytest-cov pytest-xdist

      - name: Wait for PostgreSQL and Redis
        if: steps.changes.outputs.run == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y netcat-traditional
          # В GitHub Actions сервисы доступны через localhost
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            nc -z localhost 5432 && echo "Postgres is up." && break
            echo "Waiting for Postgres... ($i/30)"
            sleep 2
          done

          echo "Waiting for Redis..."
          for i in {1..30}; do
            nc -z localhost 6379 && echo "Redis is up." && break
            echo "Waiting for Redis... ($i/30)"
            sleep 2
          done

          # Финальная проверка
          nc -z localhost 5432 || (echo "PostgreSQL failed to start" && exit 1)
          nc -z localhost 6379 || (echo "Redis failed to start" && exit 1)
          echo "All services are ready!"

      - name: Create .env file for testing
        if: steps.changes.outputs.run == 'true'
        run: |
          cd backend
          cat > .env << EOF
          SECRET_KEY=test-secret-key-for-ci-cd-only
          DB_NAME=test_db
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_HOST=localhost
          DB_PORT=5432
          REDIS_URL=redis://localhost:6379/0
          DJANGO_SETTINGS_MODULE=freesport.settings.test
          EOF

      - name: Run Django system checks
        if: steps.changes.outputs.run == 'true'
        run: |
          cd backend
          python manage.py check

      - name: Run tests with coverage
        if: steps.changes.outputs.run == 'true'
        run: |
          cd backend
          # Весь набор, кроме перф- и медленных: и те и другие меряют время, поэтому падают
          # от загрузки раннера, а не от дефекта в PR. Исполняются в performance-tests.yml.
          #
          # Покрытие считается здесь, а не в backend-ci.yml, потому что покрытие обязан мерить
          # тот прогон, который реально исполняет покрывающие тесты. Быстрый гейт запускает
          # ~1900 тестов из ~3000 и не видит интеграционных: на нём то же продакшен-покрытие
          # даёт 62 %, здесь — 76 % (замер 2026-08-06). Пока мерил быстрый гейт, каждая стори
          # с интеграционными тестами опускала метрику, и порог ломался сам собой.
          # Состав знаменателя (без тестов и миграций) задан в backend/pyproject.toml.
          #
          # Порог 75: до 2026-08-15 порог был 73 — каталог backend/data/import_1c/ в .gitignore
          # и ~32 теста импорта 1С скипались на раннере, покрываемый ими код шёл в непокрытое.
          # Теперь данные подключаются из приватного репо FREESPORT-1c-test-data (шаг checkout
          # выше), тесты исполняются, и разрыв в 1,5 п.п. между локальным и CI замером закрыт.
          # Замеры 2026-08-07: локально 76,43 %, в CI 74,92 % без данных; с данными — ожидаемо
          # ~76 %. Порог 75 оставляет запас в 1 п.п. на флуктуацию.
          #
          # Ветка без данных — PR из fork и прогон Dependabot: секретов там нет, приватный
          # data-репо не подключён. data_dependent-тесты и так скипнулись бы сами, но исключаем
          # их явно, чтобы прогон честно сообщал состав; порог — историческое значение без
          # данных (73), при 75 такой PR краснел бы на замере 74,92 % без всякой регрессии.
          # Прогон параллельно через pytest-xdist, как локально (навык docker-test-run):
          # каждому воркеру pytest-django создаёт свою test-БД (_gwN), а
          # freesport/settings/test.py разводит воркеров по БД Redis, MEDIA_ROOT и
          # ONEC_PRIVATE_DIR. -n auto берёт число ядер раннера. pytest-cov собирает
          # покрытие с воркеров сам, порог --cov-fail-under не меняется.
          if [ "$ONEC_DATA_AVAILABLE" = "true" ]; then
            pytest -n auto --tb=short -v -m "not performance and not slow" --cov=apps --cov=freesport --cov-report=xml --cov-report=term-missing --cov-fail-under=75
          else
            echo "::notice::Прогон без Actions secrets (PR из fork или Dependabot): приватный data-репо недоступен, data_dependent-тесты исключены, порог покрытия 73"
            pytest -n auto --tb=short -v -m "not performance and not slow and not data_dependent" --cov=apps --cov=freesport --cov-report=xml --cov-report=term-missing --cov-fail-under=73
          fi

      # Проверка маршрутов /manager/, /marketing/ и /supervisor/ через настоящие
      # конфиги nginx вынесена в отдельный job «Маршруты через nginx» (2026-10-25):
      # от pytest она не зависит, и параллельный запуск на своём раннере убирает
      # несколько серийных минут из прогона build (3.12).

      - name: Upload coverage reports to Codecov
        if: steps.changes.outputs.run == 'true'
        uses: codecov/codecov-action@v7
        with:
          files: backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Отдельный job (добавлен 2026-10-25): раньше этот шаг шёл внутри `build (3.12)`
  # серийно после ~3000 тестов pytest и добавлял прогону несколько минут. От тестов
  # он не зависит, поэтому идёт параллельно на своём раннере. Чек «Маршруты через
  # nginx» входит в REQUIRED_CONTEXTS .github/scripts/setup-branch-protection.sh —
  # переименование job'а = переименование контекста, менять их нужно вместе.
  # Тяжёлые шаги пропускаются на docs-only PR через тот же docs-only-check —
  # job-level `if` использовать нельзя: скипнутый job не сообщил бы required-контекст,
  # и мерж вис бы на «Expected — waiting for status» бессрочно.
  nginx-routes:
    name: Маршруты через nginx
    runs-on: ubuntu-latest

    # Состав как у build (3.12) до выноса: migrate + два runserver + nginx в docker.
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: read

    env:
      SECRET_KEY: a_test_secret_key_for_ci
      DEBUG: "False"
      DB_NAME: test_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: freesport.settings.test

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Нужен ли прогон
        id: changes
        uses: ./.github/actions/docs-only-check
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        if: steps.changes.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Wait for PostgreSQL and Redis
        if: steps.changes.outputs.run == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y netcat-traditional
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            nc -z localhost 5432 && echo "Postgres is up." && break
            echo "Waiting for Postgres... ($i/30)"
            sleep 2
          done

          echo "Waiting for Redis..."
          for i in {1..30}; do
            nc -z localhost 6379 && echo "Redis is up." && break
            echo "Waiting for Redis... ($i/30)"
            sleep 2
          done

          nc -z localhost 5432 || (echo "PostgreSQL failed to start" && exit 1)
          nc -z localhost 6379 || (echo "Redis failed to start" && exit 1)
          echo "All services are ready!"

      - name: Create .env file for testing
        if: steps.changes.outputs.run == 'true'
        run: |
          cd backend
          cat > .env << EOF
          SECRET_KEY=test-secret-key-for-ci-cd-only
          DB_NAME=test_db
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_HOST=localhost
          DB_PORT=5432
          REDIS_URL=redis://localhost:6379/0
          DJANGO_SETTINGS_MODULE=freesport.settings.test
          EOF

      # Разделы /manager/ (стори 42.4), /marketing/ (42.6) и /supervisor/ (42.7) через настоящие конфиги
      # nginx: local.conf и production default.conf. Django-тесты ходят мимо nginx, а
      # статический тест конфига (test_nginx_security_headers.py) не заметит, например, лишний rewrite или потерю
      # cookie. Анонимная проверка — та же, что в deploy.yml на проде; вход менеджера и его
      # список — только здесь: на проде тестовой учётной записи нет, поэтому default.conf
      # с входом проверяется на этом изолированном стенде.
      # Django — на раннере, на порту 8000 из upstream backend в nginx.conf; nginx — в
      # Docker, имена backend и frontend указывают на раннер. Next не нужен: /manager/ в
      # него не уходит. База — test_db сервиса postgres: в этом job'е pytest нет,
      # test_db пустая и мигрируется с нуля.
      # Django запускается по очереди с настройками каждого конфига: за local.conf —
      # development (в test пустой ALLOWED_HOSTS, Django ответил бы 400), за default.conf —
      # production. Только у production есть SECURE_PROXY_SSL_HEADER и Secure-cookie: HTTPS
      # от nginx Django считает защищённым и сверяет Origin/Referer входа с адресом сайта.
      # С development HTTPS-ветка эту проверку не воспроизводила (R42.4-36).
      # Порты хоста — стандартные 80 и 443, как на проде: nginx передаёт в Django
      # `Host $host` без порта, и Origin формы с нестандартным портом не совпал бы с ним.
      # default.conf монтируется без правок, как на проде: вместо сертификата Let's Encrypt
      # по тому же пути лежит самоподписанный на localhost, curl доверяет ему через
      # CURL_CA_BUNDLE. Запрос идёт в HTTPS-сервер default_server, server_name не важен.
      - name: Маршруты /manager/, /marketing/ и /supervisor/ через nginx (local.conf и default.conf)
        if: steps.changes.outputs.run == 'true'
        env:
          DJANGO_SETTINGS_MODULE: freesport.settings.development
          ALLOWED_HOSTS: localhost
          # Для production: без него в списке пустой источник, и системная проверка
          # corsheaders (E013) не даёт runserver стартовать. development его не читает.
          CORS_ALLOWED_ORIGINS: https://localhost
          MANAGER_EMAIL: ci-manager@example.com
          MANAGER_PASSWORD: ci-manager-password
          OWN_CLIENT_EMAIL: ci-own-client@example.com
          FOREIGN_CLIENT_EMAIL: ci-foreign-client@example.com
        run: |
          (cd backend && python manage.py migrate --noinput)
          # Ответственного у клиента назначает хук 42.2 по правилам региона —
          # закрепляем явно, как в тестах раздела.
          (cd backend && python manage.py shell) <<'EOF'
          import os
          from django.contrib.auth.models import Group
          from apps.users.models import User
          from apps.users.staff_roles import MANAGERS_GROUP

          group = Group.objects.get(name=MANAGERS_GROUP)
          manager = User.objects.create_user(os.environ["MANAGER_EMAIL"], os.environ["MANAGER_PASSWORD"], is_staff=True)
          other_manager = User.objects.create_user("ci-other-manager@example.com", is_staff=True)
          for staff in (manager, other_manager):
              staff.groups.add(group)
          for email, owner in ((os.environ["OWN_CLIENT_EMAIL"], manager), (os.environ["FOREIGN_CLIENT_EMAIL"], other_manager)):
              client = User.objects.create_user(email, role="retail")
              User.objects.filter(pk=client.pk).update(responsible_manager=owner)
          EOF
          CERT_DIR="$RUNNER_TEMP/letsencrypt/live/optisport.ru"
          mkdir -p "$CERT_DIR"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost" \
            -keyout "$CERT_DIR/privkey.pem" -out "$CERT_DIR/fullchain.pem" 2>/dev/null
          # <имя контейнера> <файл conf.d> <порт хоста:порт контейнера>
          run_nginx() {
            docker run -d --name "$1" -p "$3" \
              --add-host backend:host-gateway --add-host frontend:host-gateway \
              -v "$GITHUB_WORKSPACE/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
              -v "$GITHUB_WORKSPACE/docker/nginx/conf.d/$2:/etc/nginx/conf.d/default.conf:ro" \
              -v "$GITHUB_WORKSPACE/docker/nginx/snippets:/etc/nginx/snippets:ro" \
              -v "$RUNNER_TEMP/letsencrypt:/etc/letsencrypt:ro" \
              nginx:alpine
          }
          run_nginx nginx-local local.conf 80:80
          run_nginx nginx-prod default.conf 443:443
          export CURL_CA_BUNDLE="$CERT_DIR/fullchain.pem"
          # <модуль настроек> — Django в фоне на порту 8000, лог по последней части имени.
          start_django() {
            (cd backend && DJANGO_SETTINGS_MODULE="$1" exec python manage.py runserver 0.0.0.0:8000 --noreload) \
              > "$RUNNER_TEMP/runserver-${1##*.}.log" 2>&1 &
            DJANGO_PID=$!
          }
          # Готовность: `docker run -d` не ждёт, пока nginx начнёт слушать порт. Годится
          # любой HTTP-ответ — код проверяют скрипты; кто не поднялся за 30 попыток, на том
          # проверка упадёт сама и покажет логи.
          wait_ready() {
            for url in "$@"; do
              for i in $(seq 1 30); do
                curl -s -o /dev/null --connect-timeout 2 --max-time 5 "$url" && break
                sleep 1
              done
            done
          }
          check_section() {
            echo "--- $1"
            bash scripts/deploy/check-manager-route.sh "$1" \
              && bash scripts/deploy/check-manager-session.sh "$1" \
                "$MANAGER_EMAIL" "$MANAGER_PASSWORD" "$OWN_CLIENT_EMAIL" "$FOREIGN_CLIENT_EMAIL" \
              && bash scripts/deploy/check-manager-route.sh "$1" marketing \
              && bash scripts/deploy/check-manager-route.sh "$1" supervisor
          }
          failed=0

          start_django freesport.settings.development
          wait_ready http://localhost:8000/manager/login/ http://localhost/manager/login/
          check_section http://localhost || failed=1
          kill "$DJANGO_PID"
          wait "$DJANGO_PID" || true

          start_django freesport.settings.production
          wait_ready http://localhost:8000/manager/login/ https://localhost/manager/login/
          check_section https://localhost || failed=1
          # Отрицательный контроль стенда: тот же вход с верными cookie и токеном, но без
          # Origin и Referer production-настройки отклоняют (403). Иначе HTTPS-ветка снова
          # проверяет не production-семантику CSRF, и зелёный вход ничего не доказывает.
          JAR="$RUNNER_TEMP/csrf-control-cookies"
          TOKEN=$(curl -sS -c "$JAR" https://localhost/manager/login/ \
            | sed -n 's/.*name="csrfmiddlewaretoken" value="\([^"]*\)".*/\1/p' | head -n 1)
          CODE=$(curl -sS -b "$JAR" -o /dev/null -w '%{http_code}' \
            --data-urlencode "csrfmiddlewaretoken=$TOKEN" \
            --data-urlencode "username=$MANAGER_EMAIL" \
            --data-urlencode "password=$MANAGER_PASSWORD" \
            https://localhost/manager/login/) || CODE=""
          if [ -z "$TOKEN" ]; then
            echo "❌ /manager/login/: нет CSRF-токена формы для отрицательного контроля"
            failed=1
          elif [ "$CODE" != "403" ]; then
            echo "❌ Вход без Origin и Referer: ожидался 403 production-проверки CSRF, получено ${CODE:-нет ответа}"
            failed=1
          else
            echo "✅ Без Origin и Referer production-настройки отклоняют вход (403)"
          fi

          if [ "$failed" = 1 ]; then
            echo "--- runserver (development)"; cat "$RUNNER_TEMP/runserver-development.log"
            echo "--- runserver (production)"; cat "$RUNNER_TEMP/runserver-production.log"
            echo "--- nginx-local (local.conf)"; docker logs nginx-local
            echo "--- nginx-prod (default.conf)"; docker logs nginx-prod
            exit 1
          fi
