name: Настройка правил защиты веток

# Запуск ТОЛЬКО вручную и осознанно.
#
# Раньше здесь были триггеры `create` и `push`. Оба удалены 2026-09-07:
#   * `create` срабатывает на создание ЛЮБОЙ ветки или тега (комментарий «при создании
#     репозитория» был неверен) — каждая новая ветка заводила issue «настройка выполнена»,
#     накопилось 12 штук, при том что защита ни разу не применилась;
#   * `push` с фильтром путей на этот же файл означал, что мерж любой правки workflow
#     запускает его самого.
#
# ⚠️ Нужен PAT в секрете BRANCH_PROTECTION_TOKEN. Штатный GITHUB_TOKEN здесь бесполезен:
# и чтение, и запись branch protection требуют прав администратора репозитория, а среди
# ключей блока `permissions` области `administration` попросту нет (попытка её указать
# ломает компиляцию workflow). Нужен classic PAT со scope `repo` либо fine-grained PAT
# с разрешением «Administration: Read and write» на этот репозиторий.
#
# Подробности — в deferred-work.md.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check — только показать текущее состояние; apply — применить правила"
        required: true
        default: check
        type: choice
        options:
          - check
          - apply

jobs:
  setup-branch-protection:
    name: Настройка правил защиты веток
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout кода
        uses: actions/checkout@v7

      - name: Настройка правил защиты веток
        run: |
          chmod +x .github/scripts/setup-branch-protection.sh
          .github/scripts/setup-branch-protection.sh
        env:
          GITHUB_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          MODE: ${{ inputs.mode }}
