name: Deploy to Server

# Единственная прод-цепочка проекта: сборка образов -> approval -> SSH-деплой -> откат.
# До 2026-09-20 те же образы параллельно собирали backend-ci и frontend-ci, и каждый из
# них ещё и дёргал этот workflow через createWorkflowDispatch — один push в main давал
# два деплоя подряд и четыре сборки. Джобы `build`/`deploy-*` из тех workflow удалены:
# прод тянет только тег `:production`, а его собирает исключительно этот файл.
on:
  # Синк develop -> main (fast-forward push проверенного коммита) = релиз.
  # Тесты здесь не гоняются: этот же коммит уже зелёный на PR в develop.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Окружение для деплоя"
        required: false
        default: "production"
        type: string
      skip_tests:
        description: "Пропустить тесты (только для hotfix)"
        required: false
        default: false
        type: boolean
      image_tag:
        description: "ОТКАТ: тег образа из ghcr для деплоя без пересборки (например 0fefabf4...). Пусто — собрать из текущего main"
        required: false
        default: ""
        type: string

# Два деплоя на один сервер одновременно ломают друг другу compose и миграции.
# cancel-in-progress: false — начатый деплой нельзя прерывать на середине, новый ждёт.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  # Определение окружения
  setup:
    runs-on: ubuntu-latest

    # Без лимита зависший прогон висит дефолтные 6 часов. Пара echo в GITHUB_OUTPUT.
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      should_deploy: ${{ steps.set-env.outputs.should_deploy }}
      image_tag: ${{ steps.set-env.outputs.image_tag }}
      needs_build: ${{ steps.set-env.outputs.needs_build }}
    steps:
      - name: Определение окружения
        id: set-env
        env:
          INPUT_ENV: ${{ github.event.inputs.environment }}
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          ENV_NAME="${INPUT_ENV:-production}"
          echo "environment=$ENV_NAME" >> $GITHUB_OUTPUT
          echo "should_deploy=true" >> $GITHUB_OUTPUT

          # Откат: задан готовый тег -> деплоим его как есть, ничего не собираем.
          if [ -n "$INPUT_TAG" ]; then
            echo "image_tag=$INPUT_TAG" >> $GITHUB_OUTPUT
            echo "needs_build=false" >> $GITHUB_OUTPUT
            echo "::notice::Режим откатa: деплой готового тега $INPUT_TAG без пересборки"
          else
            echo "image_tag=production" >> $GITHUB_OUTPUT
            echo "needs_build=true" >> $GITHUB_OUTPUT
          fi

      - name: Прод собирается только из main
        if: steps.set-env.outputs.environment == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "❌ Запуск с ветки ${{ github.ref_name }}, а окружение — production."
          echo "   Тег :production обязан соответствовать коду main, иначе следующий деплой"
          echo "   поднимет на проде чужую ветку. Ручной прогон с develop 2026-09-20"
          echo "   (run 35499330509) уже перезаписал этот тег сборкой из develop."
          echo "   Синкни develop -> main и запусти оттуда."
          exit 1

  # Тестирование перед деплоем
  # Тесты только на ручном прогоне и только если их явно не пропустили. На push в main
  # их нет намеренно: main — fast-forward того коммита, который уже прошёл гейт на PR
  # в develop, и повторный прогон проверял бы тот же SHA во второй раз.
  test:
    needs: setup
    if: |
      needs.setup.outputs.should_deploy == 'true'
      && github.event_name == 'workflow_dispatch'
      && github.event.inputs.skip_tests != 'true'
      && needs.setup.outputs.needs_build == 'true'
    runs-on: ubuntu-latest

    # Без лимита зависший прогон висит дефолтные 6 часов. Полный pytest, как в Django CI (там лимит
    # 30), плюс установка зависимостей.
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: freesport_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}

      - name: Install backend dependencies
        run: |
          cd backend
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          pip install pytest-django pytest-cov

      - name: Create test .env
        run: |
          cd backend
          cat > .env << EOF
          SECRET_KEY=test-secret-key
          DB_NAME=freesport_test
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_HOST=localhost
          DB_PORT=5432
          REDIS_URL=redis://localhost:6379/0
          DJANGO_SETTINGS_MODULE=freesport.settings.test
          EOF

      - name: Run backend tests
        env:
          DJANGO_SETTINGS_MODULE: freesport.settings.test
        run: |
          cd backend
          source venv/bin/activate
          python manage.py migrate --noinput
          # Порог покрытия снят 2026-08-06 по той же причине, что и в backend-ci.yml: набор
          # здесь тот же узкий, интеграционных тестов он не исполняет, поэтому его метрика
          # занижена систематически. Покрытие с порогом меряет main.yml на полном наборе.
          # --ignore снят 2026-08-15: оба файла имеют @pytest.mark.data_dependent и исключаются
          # фильтром "not data_dependent".
          pytest -m "not integration and not data_dependent and not performance and not slow"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci --prefer-offline --no-audit

      - name: Run frontend tests
        run: |
          cd frontend
          npm run test:coverage
        env:
          CI: true

  # Сборка Docker образов
  build:
    needs: [setup, test]
    if: always() && needs.setup.outputs.should_deploy == 'true' && needs.setup.outputs.needs_build == 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest

    # Без лимита зависший прогон висит дефолтные 6 часов. Две сборки образов с пушем в ghcr;
    # наблюдалось 5,5 мин, но промах
    # кэша слоёв удлиняет её в разы.
    timeout-minutes: 45
    # environment здесь намеренно НЕ указан: он вешал на сборку второй approval, хотя
    # из окружения бралось одно значение — NEXT_PUBLIC_API_URL, публичный URL, который
    # и так вкомпилирован в бандл. Оно переехало в vars. Прод защищает approval у
    # deploy-production; сборка же только кладёт образы в ghcr и на прод не влияет.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      backend_tag: ${{ steps.meta-backend.outputs.tags }}
      frontend_tag: ${{ steps.meta-frontend.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=production

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=production

      - name: Build and push Backend image
        uses: docker/build-push-action@v7
        env:
          # v6 включил build summary и выгрузку build record по умолчанию;
          # оставляем поведение как на v5, чтобы не копить .dockerbuild-артефакты
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DJANGO_SETTINGS_MODULE=freesport.settings.production

      - name: Build and push Frontend image
        uses: docker/build-push-action@v7
        env:
          # v6 включил build summary и выгрузку build record по умолчанию;
          # оставляем поведение как на v5, чтобы не копить .dockerbuild-артефакты
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NODE_ENV=production

  # Деплой на production
  deploy-production:
    needs: [setup, build]
    # always() обязателен: при откате (image_tag задан) build скипается, и без always()
    # деплой скипнулся бы вместе с ним — ровно так деплой молча не выполнялся до 2026-09-20.
    if: always() && needs.setup.outputs.environment == 'production' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest

    # Без лимита зависший прогон висит дефолтные 6 часов. SSH-деплой: дамп БД, pull
    # образов, рестарты, миграции, collectstatic и health check (до 2,5 мин на каждую
    # из двух проверок).
    #
    # Ожидание approval лимит НЕ расходует: пока job ждёт одобрения environment,
    # он не запущен, и таймер начинается с момента старта на раннере.
    #
    # Это самый важный лимит в файле: зависший SSH-шаг оставляет прод между
    # `compose up` и миграциями — с новым образом и старой схемой БД.
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.PRODUCTION_SERVER_HOST }} >> ~/.ssh/known_hosts

      # ssh ... VAR=... bash -se <<'ENDSSH' — единственный способ довезти значения до
      # сервера. Раньше здесь был `ssh host << 'ENDSSH'`: кавычки запрещают подстановку
      # на раннере, а на сервере переменных job'а нет, поэтому `cd $DEPLOY_PATH` уводил
      # в домашний каталог, а `docker pull $BACKEND_IMAGE` вызывался без аргумента.
      - name: Create backup before deploy
        env:
          SERVER_HOST: ${{ secrets.PRODUCTION_SERVER_HOST }}
          SERVER_USER: ${{ secrets.PRODUCTION_SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
        run: |
          ssh "$SERVER_USER@$SERVER_HOST" DEPLOY_PATH="$DEPLOY_PATH" bash -se << 'ENDSSH'
            set -e
            cd "$DEPLOY_PATH"
            
            echo "💾 Создание резервной копии базы данных..."
            # --env-file обязателен: без него compose не видит .env.prod и падает на
            # подстановке ONEC_DATA_DIR (`invalid spec: :/app/data/import_1c`), а `up -d`
            # пересоздал бы контейнеры с пустыми SECRET_KEY и DB_PASSWORD.
            COMPOSE="docker compose --env-file .env.prod -f docker/docker-compose.prod.yml"

            BACKUP_FILE="backup_$(date +%Y%m%d_%H%M%S).sql"
            $COMPOSE exec -T db pg_dump -U postgres freesport > "backups/$BACKUP_FILE"
            
            # Сохраняем только последние 5 бэкапов
            ls -t backups/*.sql | tail -n +6 | xargs -r rm
            
            echo "✅ Резервная копия создана: $BACKUP_FILE"
          ENDSSH

      - name: Deploy to production server
        env:
          SERVER_HOST: ${{ secrets.PRODUCTION_SERVER_HOST }}
          SERVER_USER: ${{ secrets.PRODUCTION_SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          # Тег из setup: `production` для обычного релиза, конкретный SHA при откате.
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}:${{ needs.setup.outputs.image_tag }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}:${{ needs.setup.outputs.image_tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh "$SERVER_USER@$SERVER_HOST" \
            DEPLOY_PATH="$DEPLOY_PATH" \
            BACKEND_IMAGE="$BACKEND_IMAGE" \
            FRONTEND_IMAGE="$FRONTEND_IMAGE" \
            GHCR_USER="$GHCR_USER" \
            GHCR_TOKEN="$GHCR_TOKEN" \
            bash -se << 'ENDSSH'
            set -e
            cd "$DEPLOY_PATH"

            # Digest образов ДО обновления — точка возврата для откатa.
            echo "🔖 Фиксация текущего релиза для откатa..."
            {
              echo "# $(date -Iseconds)"
              docker image inspect --format '{{index .RepoDigests 0}}' "$BACKEND_IMAGE" 2>/dev/null || true
              docker image inspect --format '{{index .RepoDigests 0}}' "$FRONTEND_IMAGE" 2>/dev/null || true
            } > .last-release-digests || true
            cat .last-release-digests || true
            
            # fetch + reset, а НЕ git pull: на проде pull падает от любых локальных
            # изменений в рабочей копии и запрещён правилом .windsurf/rules/security-and-git.md.
            echo "📥 Обновление кода из Git..."
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            
            echo "🔐 Авторизация в GitHub Container Registry..."
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            
            echo "📦 Загрузка новых образов..."
            docker pull "$BACKEND_IMAGE"
            docker pull "$FRONTEND_IMAGE"

            # compose читает их из окружения (см. docker-compose.prod.yml).
            export BACKEND_IMAGE FRONTEND_IMAGE

            # .env.prod — источник остальных переменных compose; переменные окружения
            # (BACKEND_IMAGE/FRONTEND_IMAGE) приоритетнее env-file и не затираются им.
            COMPOSE="docker compose --env-file .env.prod -f docker/docker-compose.prod.yml"
            
            echo "🚀 Перезапуск сервисов (zero-downtime)..."
            # Сначала обновляем backend и celery
            $COMPOSE up -d --no-deps --force-recreate backend
            sleep 15
            
            # Проверяем здоровье backend
            if ! $COMPOSE exec -T backend python manage.py check --deploy; then
              echo "❌ Backend health check failed, rolling back..."
              $COMPOSE up -d --no-deps backend
              exit 1
            fi
            
            # Обновляем остальные сервисы
            $COMPOSE up -d --no-deps --force-recreate frontend celery celery-beat
            
            echo "⏳ Ожидание запуска сервисов..."
            sleep 30
            
            echo "🔄 Выполнение миграций..."
            $COMPOSE exec -T backend python manage.py migrate --noinput
            
            echo "📁 Сбор статических файлов..."
            $COMPOSE exec -T backend python manage.py collectstatic --noinput
            
            echo "🔧 Проверка конфигурации Nginx (production с SSL)..."
            $COMPOSE exec -T nginx nginx -t
            
            echo "🔄 Перезагрузка Nginx..."
            $COMPOSE exec -T nginx nginx -s reload
            
            echo "🧹 Очистка старых образов..."
            docker image prune -f
            
            echo "✅ Деплой на production завершен!"
          ENDSSH

      - name: Health check production
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          echo "🔍 Проверка работоспособности production..."

          # Проверка API
          for i in {1..10}; do
            if curl -sf "$PRODUCTION_URL/api/v1/health/" > /dev/null; then
              echo "✅ API доступен"
              API_OK=true
              break
            fi
            echo "⏳ Попытка $i/10..."
            sleep 15
          done

          if [ "$API_OK" != "true" ]; then
            echo "❌ API недоступен после деплоя"
            exit 1
          fi

          # Проверка Frontend
          for i in {1..10}; do
            if curl -sf "$PRODUCTION_URL" > /dev/null; then
              echo "✅ Frontend доступен"
              FRONTEND_OK=true
              break
            fi
            echo "⏳ Попытка $i/10..."
            sleep 15
          done

          if [ "$FRONTEND_OK" != "true" ]; then
            echo "❌ Frontend недоступен после деплоя"
            exit 1
          fi

          echo "✅ Все проверки пройдены успешно!"

      - name: Notify production deployment
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const status = '${{ job.status }}';
            const emoji = status === 'success' ? '✅' : '❌';
            const message = status === 'success' 
              ? 'Production deployment completed successfully!'
              : 'Production deployment failed!';

            // Создаем issue для отслеживания деплоя
            if (status !== 'success') {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `${emoji} Production Deployment Failed - ${new Date().toISOString()}`,
                body: `## Deployment Failed\n\n**Commit:** ${context.sha}\n**Actor:** ${context.actor}\n**Workflow Run:** ${context.runId}\n\nPlease investigate and fix the issue.`,
                labels: ['deployment', 'urgent']
              });
            }

            console.log(`${emoji} ${message}`);

  # Инструкция откатa при неудачном деплое.
  #
  # Раньше здесь стояло `if: github.event_name == 'workflow_dispatch' && failure()` —
  # на автоматическом релизе (push в main) job не запускался вовсе, а его текст не
  # называл ни образа, ни тега, то есть откатывать было не по чему. Теперь job
  # срабатывает на любом провале деплоя и печатает готовые команды.
  #
  # Сам откат — отдельный прогон этого workflow с входом `image_tag`: образ уже лежит
  # в ghcr (каждый релиз пушится с тегом-SHA), пересборка не нужна, тесты пропускаются.
  rollback:
    if: always() && needs.deploy-production.result == 'failure'
    needs: [setup, deploy-production]
    runs-on: ubuntu-latest

    # Без лимита зависший прогон висит дефолтные 6 часов. Печать инструкций в summary.
    timeout-minutes: 10

    steps:
      - name: Как откатить прод
        env:
          PREV_SHA: ${{ github.event.before }}
          TAG: ${{ needs.setup.outputs.image_tag }}
        run: |
          {
            echo "## ❌ Деплой провалился — прод мог остаться в промежуточном состоянии"
            echo ""
            echo "Деплоился тег \`$TAG\` (commit \`${GITHUB_SHA:0:8}\`)."
            echo ""
            echo "### Откат через Actions (предпочтительно)"
            echo ""
            echo "Actions → Deploy to Server → Run workflow → \`image_tag\` = тег прошлого"
            echo "удачного релиза. Образы там уже собраны, пересборки и тестов не будет."
            if [ -n "$PREV_SHA" ] && [ "$PREV_SHA" != "0000000000000000000000000000000000000000" ]; then
              echo ""
              echo "Предыдущий коммит main: \`$PREV_SHA\` → \`image_tag\` = \`${PREV_SHA:0:40}\`"
            fi
            echo ""
            echo "### Откат руками на сервере"
            echo ""
            echo '```bash'
            echo "cat .last-release-digests   # digest'ы образов до этого деплоя"
            echo "export BACKEND_IMAGE=<digest бэкенда>"
            echo "export FRONTEND_IMAGE=<digest фронтенда>"
            echo "docker compose --env-file .env.prod -f docker/docker-compose.prod.yml up -d --force-recreate \\"
            echo "  backend frontend celery celery-beat"
            echo '```'
            echo ""
            echo "Файл \`.last-release-digests\` пишется в каталог деплоя перед каждым"
            echo "обновлением образов. Дамп БД — в \`backups/\` (хранятся последние 5)."
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
